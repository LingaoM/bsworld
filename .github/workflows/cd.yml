name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: cd-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish the tested main image
    # A fork PR can also have a branch named main; verify the event and repository.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check whether this commit is still current
        id: main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/main"
          request = Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "BSWorld-CD",
          })
          with urlopen(request, timeout=30) as response:
              current_sha = json.load(response)["object"]["sha"]
          publish = current_sha == os.environ["SOURCE_SHA"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"publish={str(publish).lower()}\n")
          if not publish:
              message = "Skipped publication: main has advanced beyond this CI commit."
              print(message)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(message + "\n")
          PY

      - name: Download the publication result from main CI
        if: steps.main.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bsworld-image-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/bsworld-image-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Read the tested image metadata
        if: steps.main.outputs.publish == 'true'
        env:
          CI_IMAGE: ${{ runner.temp }}/bsworld-image-${{ github.run_id }}-${{ github.run_attempt }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Read artifact data as JSON; never execute scripts from the CI artifact.
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          metadata = json.loads((Path(os.environ["CI_IMAGE"]) / "metadata.json").read_text())
          expected = {
              "source_sha": os.environ["SOURCE_SHA"],
              "run_id": os.environ["CI_RUN_ID"],
              "run_attempt": os.environ["CI_RUN_ATTEMPT"],
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(f"CI image metadata mismatch: {key}")
          repository = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower()
          image_id = metadata["image_id"]
          image_tag = metadata["image_tag"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", image_id):
              raise SystemExit("Invalid CI image ID")
          expected_tag = f"bsworld-ci:{os.environ['CI_RUN_ID']}-{os.environ['CI_RUN_ATTEMPT']}"
          if image_tag != expected_tag:
              raise SystemExit("CI image tag mismatch")
          if metadata.get("runner_name") != os.environ["RUNNER_NAME"]:
              raise SystemExit("CD must run on the same self-hosted runner as CI")
          source_sha = os.environ["SOURCE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("Invalid CI source commit")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"IMAGE_ID={image_id}\nCI_IMAGE_TAG={image_tag}\n")
              output.write(f"IMAGE_TAG={repository}:sha-{source_sha}\nIMAGE_REPOSITORY={repository}\n")
          PY

      - name: Locate the tested image on the runner
        if: steps.main.outputs.publish == 'true'
        run: |
          # Never rebuild in CD or substitute another image for the tested ID.
          actual_id="$(docker image inspect --format '{{.Id}}' "$CI_IMAGE_TAG")"
          if [[ "$actual_id" != "$IMAGE_ID" ]]; then
            printf 'The local image does not match the image tested by CI.\n' >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        if: steps.main.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: steps.main.outputs.publish == 'true'
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          docker tag "$IMAGE_ID" "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          docker tag "$IMAGE_ID" "$IMAGE_REPOSITORY:latest"
          docker push "$IMAGE_REPOSITORY:latest"
          {
            printf 'Published: `%s` and `%s:latest`\n\n' "$IMAGE_TAG" "$IMAGE_REPOSITORY"
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Tested by: %s\n\n' "$CI_URL"
            docker image inspect --format '{{json .RepoDigests}}' "$IMAGE_ID"
          } >> "$GITHUB_STEP_SUMMARY"
