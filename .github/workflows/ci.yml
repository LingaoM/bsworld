name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: Rebuild all image layers for validation without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  # Both jobs build and test the checkout. CD publishes successful main builds.
  checks:
    name: Test pull request
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 300
    steps: &test_steps
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare reports directory
        run: |
          export CI_RESULTS="$RUNNER_TEMP/bsworld-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$CI_RESULTS"
          chmod a+rwx "$CI_RESULTS"
          echo "CI_RESULTS=$CI_RESULTS" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install BSWorld
        run: python -m pip install -e .

      - name: Lint the current checkout
        run: |
          python -m ruff check --no-cache src tests \
            2>&1 | tee "$CI_RESULTS/ruff.log"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit -q -p no:cacheprovider \
            --out-dir "$CI_RESULTS/unit" --junitxml="$CI_RESULTS/unit.xml" \
            2>&1 | tee "$CI_RESULTS/unit.log"

      # Docker preparation starts only after lint and unit tests succeed.
      - name: Prepare the candidate image tag
        run: |
          image_tag="bsworld-ci:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          printf '%s\n' "$image_tag" > "$CI_RESULTS/environment.txt"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the candidate runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            BUILD_UID=1000
            BUILD_GID=1000
            BUILD_JOBS=4
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          no-cache: ${{ inputs.rebuild_image || false }}
          cache-from: type=gha,scope=bsworld-amd64
          cache-to: type=gha,scope=bsworld-amd64,mode=max,ignore-error=true

      - name: Record the built image
        run: |
          # Test and publish the same immutable image ID.
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          echo "IMAGE_ID=$image_id" >> "$GITHUB_ENV"
          docker image inspect "$image_id" > "$CI_RESULTS/image.json"

      - name: Run all integration tests
        run: |
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$CI_RESULTS,dst=/output" \
            --env PYTHONDONTWRITEBYTECODE \
            --env PYTHONPATH=/workspace \
            "$IMAGE_ID" python -m pytest tests/integration -n 2 -p no:cacheprovider \
              --out-dir /output/integration --junitxml=/output/integration.xml \
            2>&1 | tee "$CI_RESULTS/integration.log"

      - name: Summarize test reports
        if: ${{ always() && env.CI_RESULTS != '' }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          results = Path(os.environ["CI_RESULTS"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              environment = results / "environment.txt"
              if environment.exists():
                  summary.write(f"Environment: `{environment.read_text().strip()}`\n\n")
              summary.write("| Suite | Tests | Failures | Errors | Skipped |\n")
              summary.write("|---|---:|---:|---:|---:|\n")
              for name in ("unit", "integration"):
                  report = results / f"{name}.xml"
                  if not report.exists():
                      summary.write(f"| {name} | No report | | | |\n")
                      continue
                  root = ET.parse(report).getroot()
                  suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
                  counts = [sum(int(s.get(key, "0")) for s in suites)
                            for key in ("tests", "failures", "errors", "skipped")]
                  summary.write(f"| {name} | " + " | ".join(map(str, counts)) + " |\n")
          PY

      - name: Upload reports, logs, and captures
        if: ${{ always() && env.CI_RESULTS != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bsworld-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_RESULTS }}
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare the main CI result for CD
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          export CI_IMAGE="$RUNNER_TEMP/bsworld-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$CI_IMAGE"
          echo "CI_IMAGE=$CI_IMAGE" >> "$GITHUB_ENV"
          # CI and CD share the Docker daemon on the single self-hosted runner.
          # Upload only metadata; keep the tested image tagged in the local daemon.
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "image_id": os.environ["IMAGE_ID"],
              "image_tag": os.environ["IMAGE_TAG"],
              "runner_name": os.environ["RUNNER_NAME"],
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          path = Path(os.environ["CI_IMAGE"]) / "metadata.json"
          path.write_text(json.dumps(metadata, indent=2) + "\n")
          PY

      - name: Upload the main CI result for CD
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bsworld-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_IMAGE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  main:
    name: Test main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 300
    steps: *test_steps

  result:
    name: CI result
    if: always()
    needs: [checks, main]
    runs-on: [self-hosted, linux, x64]
    permissions: {}
    steps:
      - name: Check the required job result
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          MAIN_RESULT: ${{ needs.main.result }}
        run: |
          [[ "$CHECKS_RESULT" == success && "$MAIN_RESULT" == skipped ]] || \
            [[ "$CHECKS_RESULT" == skipped && "$MAIN_RESULT" == success ]]
