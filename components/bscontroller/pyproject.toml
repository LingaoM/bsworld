[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bscontroller"
version = "0.1.0"
description = "Standalone Bluetooth LE controller with discrete simulation time"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND ISC"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["cryptography>=44.0.3"]

[project.optional-dependencies]
test = ["pytest>=8.4", "pytest-asyncio>=1.4", "pytest-xdist>=3", "ruff>=0.8", "build>=1"]

[project.scripts]
bscontroller = "bscontroller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bscontroller = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "preserve"
