<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title description">
  <title id="title">Multiple Radio Controllers sharing a BabbleSim PHY</title>
  <desc id="description">Controller 1, Controller 2, and Controller N each own a worker thread, event loop, HCI Controller, LE procedures, link-layer procedures, radio scheduler, and BabbleSim radio adapter. Each Controller connects through its own FIFO endpoint to one BabbleSim PHY process with a shared radio environment and simulation timeline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #1a1a1a; }
      .instance { font-size: 20px; }
      .boundary { fill: none; stroke: #333333; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .thread { font-size: 13px; font-style: italic; fill: #666666; }
      .layer { stroke-width: 1.2; }
      .hci { fill: #dae8fc; stroke: #6c8ebf; }
      .le { fill: #d5e8d4; stroke: #82b366; }
      .ll { fill: #e1d5e7; stroke: #9673a6; }
      .radio { fill: #fff2cc; stroke: #d6b656; }
      .label { font-size: 15px; }
      .detail { font-size: 11.5px; fill: #4d4d4d; }
      .connection { fill: none; stroke: #333333; stroke-width: 1.3; marker-start: url(#arrow); marker-end: url(#arrow); }
      .ipc { font-size: 15px; text-anchor: start; }
      .operation { font-size: 11px; fill: #666666; text-anchor: start; }
    </style>
  </defs>
  <rect width="1080" height="620" fill="#ffffff"/>

  <g id="controller-1">
    <text class="instance" x="176" y="32">Controller 1</text>
    <rect class="boundary" x="36" y="52" width="280" height="380" rx="26"/>
    <text class="thread" x="176" y="80">Worker thread · Event loop</text>
    <rect class="layer hci" x="60" y="100" width="232" height="58" rx="10"/>
    <text class="label" x="176" y="124">HCI Controller</text>
    <text class="detail" x="176" y="144">Commands · Events · ACL</text>
    <path class="connection" d="M 176 160 V 178"/>
    <rect class="layer le" x="60" y="180" width="232" height="58" rx="10"/>
    <text class="label" x="176" y="204">LE Controller Procedures</text>
    <text class="detail" x="176" y="224">Advertising · Scanning · Connections</text>
    <path class="connection" d="M 176 240 V 258"/>
    <rect class="layer ll" x="60" y="260" width="232" height="58" rx="10"/>
    <text class="label" x="176" y="284">Link Layer / Radio Scheduler</text>
    <text class="detail" x="176" y="304">LL PDUs · Timing · Radio Slots</text>
    <path class="connection" d="M 176 320 V 338"/>
    <rect class="layer radio" x="60" y="340" width="232" height="62" rx="10"/>
    <text class="label" x="176" y="365">Radio / BabbleSimRadio</text>
    <text class="detail" x="176" y="386">Independent FIFO Endpoint</text>
  </g>

  <g id="controller-2">
    <text class="instance" x="496" y="32">Controller 2</text>
    <rect class="boundary" x="356" y="52" width="280" height="380" rx="26"/>
    <text class="thread" x="496" y="80">Worker thread · Event loop</text>
    <rect class="layer hci" x="380" y="100" width="232" height="58" rx="10"/>
    <text class="label" x="496" y="124">HCI Controller</text>
    <text class="detail" x="496" y="144">Commands · Events · ACL</text>
    <path class="connection" d="M 496 160 V 178"/>
    <rect class="layer le" x="380" y="180" width="232" height="58" rx="10"/>
    <text class="label" x="496" y="204">LE Controller Procedures</text>
    <text class="detail" x="496" y="224">Advertising · Scanning · Connections</text>
    <path class="connection" d="M 496 240 V 258"/>
    <rect class="layer ll" x="380" y="260" width="232" height="58" rx="10"/>
    <text class="label" x="496" y="284">Link Layer / Radio Scheduler</text>
    <text class="detail" x="496" y="304">LL PDUs · Timing · Radio Slots</text>
    <path class="connection" d="M 496 320 V 338"/>
    <rect class="layer radio" x="380" y="340" width="232" height="62" rx="10"/>
    <text class="label" x="496" y="365">Radio / BabbleSimRadio</text>
    <text class="detail" x="496" y="386">Independent FIFO Endpoint</text>
  </g>

  <g id="more-controllers" fill="#333333" aria-label="Additional Controllers">
    <circle cx="684" cy="242" r="4"/>
    <circle cx="700" cy="242" r="4"/>
    <circle cx="716" cy="242" r="4"/>
  </g>

  <g id="controller-n">
    <text class="instance" x="904" y="32">Controller N</text>
    <rect class="boundary" x="764" y="52" width="280" height="380" rx="26"/>
    <text class="thread" x="904" y="80">Worker thread · Event loop</text>
    <rect class="layer hci" x="788" y="100" width="232" height="58" rx="10"/>
    <text class="label" x="904" y="124">HCI Controller</text>
    <text class="detail" x="904" y="144">Commands · Events · ACL</text>
    <path class="connection" d="M 904 160 V 178"/>
    <rect class="layer le" x="788" y="180" width="232" height="58" rx="10"/>
    <text class="label" x="904" y="204">LE Controller Procedures</text>
    <text class="detail" x="904" y="224">Advertising · Scanning · Connections</text>
    <path class="connection" d="M 904 240 V 258"/>
    <rect class="layer ll" x="788" y="260" width="232" height="58" rx="10"/>
    <text class="label" x="904" y="284">Link Layer / Radio Scheduler</text>
    <text class="detail" x="904" y="304">LL PDUs · Timing · Radio Slots</text>
    <path class="connection" d="M 904 320 V 338"/>
    <rect class="layer radio" x="788" y="340" width="232" height="62" rx="10"/>
    <text class="label" x="904" y="365">Radio / BabbleSimRadio</text>
    <text class="detail" x="904" y="386">Independent FIFO Endpoint</text>
  </g>

  <g id="fifo-connections">
    <path class="connection" d="M 176 404 V 528"/>
    <text class="ipc" x="194" y="474">IPC / FIFO</text>
    <text class="operation" x="194" y="494">TX · RX · WAIT</text>
    <path class="connection" d="M 496 404 V 528"/>
    <text class="ipc" x="514" y="474">IPC / FIFO</text>
    <text class="operation" x="514" y="494">TX · RX · WAIT</text>
    <path class="connection" d="M 904 404 V 528"/>
    <text class="ipc" x="922" y="474">IPC / FIFO</text>
    <text class="operation" x="922" y="494">TX · RX · WAIT</text>
  </g>

  <g id="babblesim-phy">
    <rect x="36" y="530" width="1008" height="78" rx="14" fill="#cdeb8b"/>
    <text x="540" y="560" font-size="21">BabbleSim PHY Process</text>
    <text x="540" y="586" font-size="14">BLE_simple modem · multiatt channel · Shared radio environment and simulation timeline</text>
  </g>
</svg>
