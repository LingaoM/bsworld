# The default Controller ISO TX buffer (9 bytes) leaves a BIS PDU of 1 byte,
# so LE Create BIG fails with status 0x12 and CIS data does not fit. Size the
# buffers for the 247-byte SDUs of the ISO shell, as
# tests/bsim/bluetooth/host/iso/frag_2 does.
CONFIG_BT_CTLR_ISO_TX_BUFFER_SIZE=255
CONFIG_BT_CTLR_ISO_TX_SDU_LEN_MAX=247
