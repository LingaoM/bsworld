#
# BSWorld's TrouBLE adapter. The upstream repository is pinned to one commit,
# which covers both the Host stack and the shared example applications. Only
# the native transport/executor in bsim/ and the role dispatch in
# src/bin/ble_bas.rs are maintained here.
#
# To move to a newer upstream commit, update `rev` below, refresh Cargo.lock
# with `cargo update`, and update TROUBLE_REVISION in README.md.

[package]
name = "bsworld-trouble-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
bt-hci = "0.11"
critical-section = { version = "1", features = ["std"] }
env_logger = "0.11"
trouble-bsim = { path = "bsim" }

# Pinned upstream repository: the Battery Service applications and, through
# them, the trouble-host stack under test. One rev covers both.
trouble-example-apps = { git = "https://github.com/embassy-rs/trouble", rev = "43a14413508eb63a114df672f9a93dab624b717d", features = [
    "log",
    "std",
] }

[[bin]]
name = "ble_bas"
path = "src/bin/ble_bas.rs"
