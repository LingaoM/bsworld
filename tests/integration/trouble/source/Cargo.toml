#
# BSWorld's TrouBLE adapter. The upstream repository is pinned to one commit,
# which covers both the Host stack and the shared example applications. Only
# the native transport/executor in src/bsim/ and the role dispatch in
# src/main.rs are maintained here.
#
# To move to a newer upstream commit, update `rev` below, refresh Cargo.lock
# with `cargo update`, and update TROUBLE_REVISION in README.md.

[package]
name = "bsworld-trouble-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
bt-hci = "0.11"
bt-hci-serial = "0.1"
critical-section = { version = "1", features = ["std"] }
embassy-sync = "0.8"
# src/bsim/ supplies the process-wide Embassy time driver. Do not enable
# embassy-time's `std`, `wasm`, or `mock-driver` features in this binary.
embassy-time-driver = { version = "0.2.2", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = { version = "0.3.2", features = ["generic-queue-64"] }
embedded-io = { version = "0.7", features = ["std"] }
embedded-io-async = "0.7"
env_logger = "0.11"
libc = "0.2"

# Pinned upstream repository: the Battery Service applications and, through
# them, the trouble-host stack under test. One rev covers both.
trouble-example-apps = { git = "https://github.com/embassy-rs/trouble", rev = "43a14413508eb63a114df672f9a93dab624b717d", features = [
    "log",
    "std",
] }

[dev-dependencies]
embassy-futures = "0.1"
embassy-time = "0.5.1"
tempfile = "3"

[[bin]]
name = "ble_bas"
path = "src/main.rs"
