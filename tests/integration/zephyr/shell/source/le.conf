# Exercise the Controller's LE features from the Bluetooth shell image:
# pairing and encryption, Controller-based privacy (resolving list, RPAs),
# filter accept list, user-initiated PHY and data length updates, and
# 251-octet ACL data. Bonds stay in RAM because settings storage is disabled.
# The Mesh shell does not use this file.
CONFIG_BT_SMP=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_PRIVACY=y
CONFIG_BT_RPA_TIMEOUT_DYNAMIC=y
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# Scenarios start each link procedure explicitly; automatic PHY and
# connection parameter updates would race the commands under test.
CONFIG_BT_AUTO_PHY_CENTRAL_NONE=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
